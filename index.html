<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Online v2.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fb;
      color: #102033;
    }
    header {
      background: linear-gradient(135deg, #071c36, #003f88);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin: 8px 0 0; opacity: 0.9; }
    .wrap { max-width: 1100px; margin: auto; padding: 16px; }
    .admin-panel, .customer-panel {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; }
    label { font-weight: bold; display: block; margin: 12px 0 6px; }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccd6e0;
      font-size: 1rem;
    }
    button {
      background: #0066d6;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 14px;
    }
    button:hover { background: #004da3; }
    .danger { background: #d62828; }
    .danger:hover { background: #a81818; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .price-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .price-tabs button {
      min-width: 95px;
      margin-top: 0;
      background: #e8eef7;
      color: #102033;
      border: 1px solid #cdd8e6;
    }
    .price-tabs button.active {
      background: #0066d6;
      color: white;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #dde5ef;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #edf2f7;
    }
    .card-body { padding: 12px; }
    .store-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ffcc00;
      color: #111;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .price { font-size: 1.5rem; font-weight: bold; color: #0066d6; margin: 6px 0; }
    .small { color: #526477; font-size: 0.9rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font-size: 0.85rem; padding: 9px; }
    .empty {
      text-align: center;
      padding: 28px;
      color: #526477;
      border: 2px dashed #ccd6e0;
      border-radius: 16px;
    }
    .preview {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #eef3f8;
      border-radius: 14px;
      margin-top: 10px;
      display: none;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #526477;
      font-size: 0.9rem;
    }
    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Order Online v2.0</h1>
    <p>Upload products, choose store, set price — automatic price category.</p>
  </header>

  <main class="wrap">
    <section class="admin-panel">
      <h2>Admin: Add Product</h2>
      <div class="grid-2">
        <div>
          <label for="imageInput">Product image</label>
          <input id="imageInput" type="file" accept="image/*" />
          <img id="preview" class="preview" alt="Preview" />
        </div>
        <div>
          <label for="nameInput">Product name</label>
          <input id="nameInput" placeholder="Example: Micro Beamer" />

          <label for="storeInput">Store</label>
          <select id="storeInput">
            <option value="Amazon">Amazon</option>
            <option value="Bol.com">Bol.com</option>
            <option value="eBay">eBay</option>
            <option value="Temu">Temu</option>
            <option value="Other">Other</option>
          </select>

          <label for="priceInput">Price in XCG / Euro</label>
          <input id="priceInput" type="number" step="0.01" placeholder="Example: 15" />

          <label for="noteInput">Short note</label>
          <textarea id="noteInput" rows="2" placeholder="Example: Excl. shipment, taxes, clearance and ordering fee"></textarea>

          <button onclick="saveProduct()">Save Product</button>
        </div>
      </div>
    </section>

    <section class="customer-panel">
      <h2>Customer: Browse by Price</h2>
      <div class="price-tabs" id="priceTabs"></div>
      <div id="productList" class="products"></div>
      <button class="danger" onclick="clearProducts()">Clear all saved products</button>
    </section>
  </main>

  <footer>
    Ordered by Purcy & PracShipping • WhatsApp order flow ready
  </footer>

  <script>
    const phoneNumber = "59995120536";
    const ranges = [
      { label: "1-10", min: 1, max: 10 },
      { label: "11-20", min: 11, max: 20 },
      { label: "21-30", min: 21, max: 30 },
      { label: "31-50", min: 31, max: 50 },
      { label: "51-100", min: 51, max: 100 },
      { label: "100+", min: 101, max: Infinity }
    ];

    let selectedRange = "1-10";
    let currentImage = "";

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    imageInput.addEventListener("change", function () {
      const file = imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        currentImage = event.target.result;
        preview.src = currentImage;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    function getProducts() {
      return JSON.parse(localStorage.getItem("orderOnlineProductsV2") || "[]");
    }

    function setProducts(products) {
      localStorage.setItem("orderOnlineProductsV2", JSON.stringify(products));
    }

    function getRangeLabel(price) {
      const match = ranges.find(r => price >= r.min && price <= r.max);
      return match ? match.label : "100+";
    }

    function saveProduct() {
      const name = document.getElementById("nameInput").value.trim();
      const store = document.getElementById("storeInput").value;
      const price = parseFloat(document.getElementById("priceInput").value);
      const note = document.getElementById("noteInput").value.trim();

      if (!name || !store || !price || !currentImage) {
        alert("Please add image, name, store and price.");
        return;
      }

      const product = {
        id: Date.now(),
        name,
        store,
        price,
        note,
        image: currentImage,
        range: getRangeLabel(price)
      };

      const products = getProducts();
      products.unshift(product);
      setProducts(products);

      document.getElementById("nameInput").value = "";
      document.getElementById("priceInput").value = "";
      document.getElementById("noteInput").value = "";
      imageInput.value = "";
      currentImage = "";
      preview.style.display = "none";

      selectedRange = product.range;
      renderTabs();
      renderProducts();
    }

    function renderTabs() {
      const tabs = document.getElementById("priceTabs");
      tabs.innerHTML = "";
      ranges.forEach(range => {
        const btn = document.createElement("button");
        btn.textContent = range.label;
        btn.className = selectedRange === range.label ? "active" : "";
        btn.onclick = () => {
          selectedRange = range.label;
          renderTabs();
          renderProducts();
        };
        tabs.appendChild(btn);
      });
    }

    function renderProducts() {
      const list = document.getElementById("productList");
      const products = getProducts().filter(p => p.range === selectedRange);
      list.innerHTML = "";

      if (products.length === 0) {
        list.innerHTML = `<div class="empty">No products in this price range yet.</div>`;
        return;
      }

      products.forEach(product => {
        const msg = encodeURIComponent(
          `Hello Purcy, I want to order this product:\n\n${product.name}\nStore: ${product.store}\nPrice: ${product.price}\nCategory: ${product.range}`
        );
        const waLink = `https://wa.me/${phoneNumber}?text=${msg}`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" />
          <div class="card-body">
            <span class="store-badge">${product.store}</span>
            <h3>${product.name}</h3>
            <div class="price">${product.price}</div>
            <div class="small">Price range: ${product.range}</div>
            <p class="small">${product.note || "Excl. shipment, taxes, clearance and ordering fee"}</p>
            <div class="actions">
              <button onclick="window.open('${waLink}', '_blank')">Order</button>
              <button class="danger" onclick="deleteProduct(${product.id})">Delete</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function deleteProduct(id) {
      const products = getProducts().filter(p => p.id !== id);
      setProducts(products);
      renderProducts();
    }

    function clearProducts() {
      if (!confirm("Clear all saved products?")) return;
      localStorage.removeItem("orderOnlineProductsV2");
      renderProducts();
    }

    renderTabs();
    renderProducts();
  </script>
</body>
</html>
