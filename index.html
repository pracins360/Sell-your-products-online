<!DOCTYPE html>
<html>
<head>
  <title>Kingsday Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: orange;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 10px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .title {
      font-size: 18px;
      margin: 10px 0;
      font-weight: bold;
    }

    .price {
      color: green;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 10px;
      margin: 5px 0;
      border-radius: 6px;
      text-decoration: none;
      color: white;
    }

    .whatsapp {
      background: #25D366;
    }

    .pay {
      background: #007bff;
    }
  </style>
</head>

<body>

<header>
  👑 Kingsday Market
</header>

<div class="container" id="products"></div>

<script>
fetch("https://script.google.com/macros/s/AKfycbweQNdJ_cLmXBUPNHKNn28CwoAmEfTS5LLEB-TMw8kc03putmBdL9U1AyqGuiiQn111lQ/exec")
  .then(res => res.text())
  .then(text => {
    document.getElementById("products").innerHTML =
      "<pre style='white-space:pre-wrap;background:white;padding:15px;'>" +
      text +
      "</pre>";
  })
  .catch(err => {
    document.getElementById("products").innerHTML =
      "<p style='color:red;'>Fetch error: " + err + "</p>";
  });
</script>

</body>
</html>
