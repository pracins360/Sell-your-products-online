<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Online v2.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fb;
      color: #102033;
    }
    header {
      background: linear-gradient(135deg, #071c36, #003f88);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin: 8px 0 0; opacity: 0.9; }
    .wrap { max-width: 1100px; margin: auto; padding: 16px; }
    .view-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .view-switch button {
      margin: 0;
      background: #e8eef7;
      color: #102033;
    }
    .view-switch button.active {
      background: #0066d6;
      color: white;
    }
    .panel {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .hidden { display: none; }
    h2 { margin-top: 0; }
    label { font-weight: bold; display: block; margin: 12px 0 6px; }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccd6e0;
      font-size: 1rem;
    }
    button {
      background: #0066d6;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 14px;
    }
    button:hover { background: #004da3; }
    .danger { background: #d62828; }
    .danger:hover { background: #a81818; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .price-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .price-tabs button {
      min-width: 95px;
      margin-top: 0;
      background: #e8eef7;
      color: #102033;
      border: 1px solid #cdd8e6;
    }
    .price-tabs button.active {
      background: #0066d6;
      color: white;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #dde5ef;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .card img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #edf2f7;
      padding: 6px;
    }
    .card-body { padding: 12px; }
    .store-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ffcc00;
      color: #111;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .price { font-size: 1.5rem; font-weight: bold; color: #0066d6; margin: 6px 0; }
    .small { color: #526477; font-size: 0.9rem; }
    .actions { display: flex; gap: 8px; }
